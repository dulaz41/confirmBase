# ==============================================================================
# Render Blueprint Specification for ConfirmBase Backend API
# Deploys Managed PostgreSQL and Production Docker Web Service
# ==============================================================================
services:
  - type: web
    name: confirmbase-api
    runtime: docker
    plan: starter
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: confirmbase-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: "https://getconfirmbase.ng,https://www.getconfirmbase.ng,http://localhost:3000,http://localhost:5173"
      - key: ADMIN_API_KEY
        generateValue: true
      - key: BACKUP_DIRECTORY
        value: /app/backups
      - key: EMAIL_PROVIDER
        value: console
      - key: SEND_CONFIRMATION_EMAIL
        value: "true"
      - key: EMAIL_FROM_ADDRESS
        value: noreply@getconfirmbase.ng
      - key: EMAIL_FROM_NAME
        value: "ConfirmBase Team"
      - key: PRODUCT_NAME
        value: "ConfirmBase"
      - key: COMPANY_NAME
        value: "ConfirmBase Team"

databases:
  - name: confirmbase-db
    plan: starter
    region: frankfurt
    postgresMajorVersion: 16
